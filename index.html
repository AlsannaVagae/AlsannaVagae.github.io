<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alsanna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400&family=Manrope:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --text: #e8e8e8;
            --muted: #999;
            --accent: #e879f9;
            --soft: #d8b4fe;
            --border: #2a2a2a;
        }

        body {
            font-family: Manrope, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            z-index: -2;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .fragment {
            position: absolute;
            filter: blur(0.5px);
            animation: float-drift var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
        }

        .fragment::before {
            content: '';
            display: block;
            width: var(--size);
            height: var(--size);
            background: var(--color);
            clip-path: var(--shape);
            box-shadow:
                0 0 10px var(--glow-color),
                0 0 20px var(--glow-color),
                inset 0 0 10px rgba(255, 255, 255, 0.1);
            animation:
                rotate-fragment var(--rotate-duration) linear infinite,
                pulse-glow 3s ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes float-drift {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: var(--max-opacity);
            }
            90% {
                opacity: var(--max-opacity);
            }
            100% {
                transform: translate(var(--drift-x), var(--drift-y)) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes rotate-fragment {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse-glow {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.3);
            }
        }

        .landing {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            z-index: 100;
            transition: opacity 1s, visibility 1s;
        }

        .landing.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .enter-btn {
            font: 400 1.25rem Syne, sans-serif;
            color: var(--text);
            background: none;
            border: none;
            cursor: pointer;
            padding: 1.5rem 3rem;
            position: relative;
            transition: color 0.3s;
            letter-spacing: 0.15em;
            text-transform: lowercase;
        }

        .enter-btn::after {
            content: '';
            position: absolute;
            bottom: 1rem;
            left: 3rem;
            right: 3rem;
            height: 1px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s;
        }

        .enter-btn:hover {
            color: var(--accent);
        }

        .enter-btn:hover::after {
            transform: scaleX(1);
        }

        .main-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            opacity: 0;
            transition: opacity 1.2s 0.3s;
        }

        .main-content.visible {
            opacity: 1;
        }

        .username {
            font: 400 clamp(2.5rem, 8vw, 4.5rem) Syne, sans-serif;
            margin-bottom: 4rem;
            letter-spacing: 0.05em;
            text-transform: lowercase;
            position: relative;
        }

        .username::after {
            content: '';
            position: absolute;
            bottom: -0.75rem;
            left: 50%;
            transform: translateX(-50%);
            width: 5rem;
            height: 2px;
            background: var(--soft);
            opacity: 0.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
        }

        .social-link {
            text-decoration: none;
            color: var(--muted);
            font: 300 0.95rem/1.6 Manrope, sans-serif;
            padding: 1.125rem 1.75rem;
            border-bottom: 1px solid var(--border);
            transition: all 0.3s;
            position: relative;
            letter-spacing: 0.1em;
            text-transform: lowercase;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        .social-link:first-child {
            border-top: 1px solid var(--border);
        }

        .social-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s;
        }

        .social-link:hover {
            color: var(--text);
            padding-left: 2.5rem;
            background: rgba(232, 121, 249, 0.05);
        }

        .social-link:hover::before {
            transform: scaleY(1);
        }

        .social-link:hover img {
            opacity: 0.9;
            transform: translateX(2px);
        }

        .social-link img {
            width: 16px;
            height: 16px;
            opacity: 0.5;
            transition: all 0.3s;
            filter: brightness(0) invert(1);
        }

        .social-link:nth-child(1) { animation-delay: 0.5s; }
        .social-link:nth-child(2) { animation-delay: 0.6s; }
        .social-link:nth-child(3) { animation-delay: 0.7s; }
        .social-link:nth-child(4) { animation-delay: 0.8s; }
        .social-link:nth-child(5) { animation-delay: 0.9s; }
        .social-link:nth-child(6) { animation-delay: 1s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font: 300 0.85rem Manrope, sans-serif;
            color: var(--muted);
            letter-spacing: 0.05em;
            opacity: 0.6;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .footer .heart {
            color: var(--muted);
            transition: color 0.4s ease;
        }

        .footer .heart:hover {
            color: #ff0000;
        }

        @media (max-width: 768px) {
            .username {
                margin-bottom: 3rem;
            }

            .links-container {
                max-width: 320px;
            }

            .social-link {
                padding: 1rem 1.5rem;
            }

            .social-link:hover {
                padding-left: 1.75rem;
            }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="landing" id="l">
        <button class="enter-btn" id="e">enter</button>
    </div>

    <div class="main-content" id="m">
        <h1 class="username">alsanna</h1>

        <nav class="links-container">
            <a href="https://x.com/pateafix_" target="_blank" class="social-link">
                <img src="assets/twitter.png" alt="twitter">
                <span>twitter</span>
            </a>
            <a href="discord://-/channels/@me/959105379902582886" class="social-link">
                <img src="assets/discord.png" alt="discord">
                <span>discord</span>
            </a>
            <a href="https://www.twitch.tv/alsannavagae" target="_blank" class="social-link">
                <img src="assets/twitch.png" alt="twitch">
                <span>twitch</span>
            </a>
            <a href="https://soundcloud.com/pateafix" target="_blank" class="social-link">
                <img src="assets/soundcloud.png" alt="soundcloud">
                <span>soundcloud</span>
            </a>
            <a href="https://open.spotify.com/artist/0QWrEfAQXSCyPNIDLOGgIT" target="_blank" class="social-link">
                <img src="assets/spotify.png" alt="spotify">
                <span>spotify</span>
            </a>
            <a href="https://www.youtube.com/@pateafix" target="_blank" class="social-link">
                <img src="assets/youtube.png" alt="youtube">
                <span>youtube</span>
            </a>
        </nav>
    </div>

    <div class="footer">
        made with <span class="heart">❤︎</span> by ambrosial
    </div>

    <audio id="a" loop>
        <source src="assets/music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const particles = document.getElementById('particles');
        const shapes = [
            'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)',
            'polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%)',
            'polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%)',
            'polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%)',
            'polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)',
            'polygon(50% 0%, 80% 10%, 100% 35%, 100% 70%, 80% 90%, 50% 100%, 20% 90%, 0% 70%, 0% 35%, 20% 10%)'
        ];

        const colors = [
            { bg: 'linear-gradient(135deg, rgba(232, 121, 249, 0.15), rgba(192, 132, 252, 0.25))', glow: 'rgba(232, 121, 249, 0.4)' },
            { bg: 'linear-gradient(135deg, rgba(216, 180, 254, 0.15), rgba(232, 121, 249, 0.25))', glow: 'rgba(216, 180, 254, 0.4)' },
            { bg: 'linear-gradient(135deg, rgba(192, 132, 252, 0.15), rgba(168, 85, 247, 0.25))', glow: 'rgba(192, 132, 252, 0.4)' },
            { bg: 'linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(147, 51, 234, 0.25))', glow: 'rgba(168, 85, 247, 0.4)' }
        ];

        for (let i = 0; i < 30; i++) {
            const fragment = document.createElement('div');
            fragment.className = 'fragment';

            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const size = 15 + Math.random() * 35;
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const driftX = (Math.random() - 0.5) * 200;
            const driftY = -100 - Math.random() * 200;
            const duration = 15 + Math.random() * 25;
            const delay = Math.random() * 10;
            const rotateDuration = 20 + Math.random() * 40;
            const maxOpacity = 0.4 + Math.random() * 0.3;

            fragment.style.cssText = `
                --shape: ${shape};
                --color: ${color.bg};
                --glow-color: ${color.glow};
                --size: ${size}px;
                --duration: ${duration}s;
                --delay: ${delay}s;
                --drift-x: ${driftX}px;
                --drift-y: ${driftY}px;
                --rotate-duration: ${rotateDuration}s;
                --max-opacity: ${maxOpacity};
                left: ${x}%;
                top: ${y}%;
            `;

            particles.appendChild(fragment);
        }

        e.onclick = () => {
            a.play().catch(err => console.log('audio failed idk:', err));
            l.classList.add('hidden');
            m.classList.add('visible');
        }
    </script>
</body>
</html>
